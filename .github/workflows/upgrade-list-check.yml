name: Upgrade-list consistency check

# Asserts that UPGRADE_CONTRACTS / IMMUTABLE_CONTRACTS / NON_UPGRADEABLE_CONTRACTS
# in mx/upgrade.mk exactly match which contracts expose `pub fn upgrade` in source.
# Prevents the drift described in issue #1171.

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/**/src/lib.rs"
      - "mx/upgrade.mk"
      - "scripts/check_upgrade_lists.py"
  push:
    branches: [main]
    paths:
      - "contracts/**/src/lib.rs"
      - "mx/upgrade.mk"
      - "scripts/check_upgrade_lists.py"

permissions:
  contents: read

jobs:
  upgrade-list-check:
    name: mx/upgrade.mk lists in sync with source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify upgrade lists match source
        run: python3 scripts/check_upgrade_lists.py --fix-hint
